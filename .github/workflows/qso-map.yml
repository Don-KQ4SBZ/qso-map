name: KQ4SBZ Live QSO Map

on:
  workflow_dispatch:

  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install mapping libraries
        run: pip install folium==0.20.0 playwright

      - name: Install Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Retrieve QRZ contacts and generate map
        env:
          QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
          CARTO_TILE_URL: ${{ secrets.CARTO_TILE_URL }}
        run: python3 generate_map.py

      - name: Generate map preview image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  viewport={"width": 1600, "height": 900},
                  device_scale_factor=1
              )

              url = "https://don-kq4sbz.github.io/qso-map/"

              page.route(
                  url,
                  lambda route: route.fulfill(
                      path="public/index.html",
                      content_type="text/html"
                  )
              )

              page.goto(
                  url,
                  wait_until="load",
                  timeout=120000
              )

              page.wait_for_selector(
                  ".leaflet-tile-loaded",
                  timeout=60000
              )

              page.wait_for_function(
                  """() => {
                      const tiles = document.querySelectorAll(
                          '.leaflet-tile'
                      );
                      return tiles.length > 0 &&
                          Array.from(tiles).every(
                              t => t.complete && t.naturalWidth > 0
                          );
                  }""",
                  timeout=60000
              )

              page.screenshot(
                  path="public/preview.png",
                  animations="disabled"
              )

              browser.close()

          print("Map preview generated successfully!")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
