name: KQ4SBZ Live QSO Map

on:
  workflow_dispatch:

  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install mapping library
        run: pip install folium==0.20.0

      - name: Retrieve QRZ contacts and generate map
        env:
          QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
        run: python3 generate_map.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
