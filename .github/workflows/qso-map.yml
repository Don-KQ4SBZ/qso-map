name: KQ4SBZ Live QSO Map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-qrz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve QRZ contacts
        env:
          QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
        run: python3 generate_map.py
